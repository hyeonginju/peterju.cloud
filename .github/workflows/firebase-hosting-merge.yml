# @format

# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Dart 환경 인프라 구축
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # 2. 의존성 설치 및 Jaspr 빌드
      # jaspr_cli는 dev_dependencies로 관리한다. 전역 설치(pub global activate)는
      # 매번 잠금 없이 의존성을 새로 해석해서 프로젝트의 build_daemon 버전과
      # 어긋날 수 있으므로 쓰지 않는다.
      - name: Build Jaspr Project
        run: |
          dart pub get
          dart run jaspr_cli:jaspr build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PETER_WITH_FLUTTER }}
          channelId: live
          projectId: peter-with-flutter
          firebaseToolsVersion: 15.21.0
